version: 2

sources:
  - name: ops
    description: Batch register written by the Python ingestion (run.py ingest).
    schema: ops
    tables:
      - name: batch
        description: One row per extraction attempt, successful or not.
        config:
          # Pipeline liveness: the last extraction that reached the source and passed the
          # contract (loaded or identical to the last load). Run: run.py dbt source freshness
          loaded_at_field: finished_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 8, period: day}
            filter: "status in ('loaded', 'duplicate')"
        columns:
          - name: batch_id
            data_tests: [unique, not_null]
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: [running, extracted, failed, loaded, duplicate]
          - name: mode
            data_tests:
              - accepted_values:
                  arguments:
                    values: [api, offline, simulated]

  - name: raw
    description: Payloads exactly as delivered by the FDIC API, one row per batch and record.
    schema: raw
    tables:
      - name: fdic_financials
      - name: fdic_institutions
      - name: fdic_failures
