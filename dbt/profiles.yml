# Values come from .env (python run.py dbt ... loads it). No secret is stored here.
fdic_dwh:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5435') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'fdic') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'fdic_dwh') }}"
      schema: analytics
      threads: 4
