name: fdic-dwh

services:
  postgres:
    image: postgres:16.15
    # Back after a reboot or a Docker restart; "docker compose stop" still keeps it stopped.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fdic_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-fdic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Started on demand: docker compose --profile airflow up -d --build
  airflow:
    profiles: [airflow]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: fdic-dwh-airflow:3.3.2
    # The daily run needs the scheduler up: restart it with Docker unless stopped by hand.
    restart: unless-stopped
    command: >
      bash -c "/opt/fdic-venv/bin/python /opt/fdic/docker/airflow/ensure_metadata_db.py
      && exec airflow standalone"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # dbt runs inside the container: keep its build files apart from the host's.
      DBT_TARGET_PATH: /opt/airflow/dbt/target
      DBT_LOG_PATH: /opt/airflow/dbt/logs
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fdic}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Local development only: no login screen.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - .:/opt/fdic
      - airflow-logs:/opt/airflow/logs
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8096}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  airflow-logs:
