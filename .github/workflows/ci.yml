# Same checks as `python run.py check`: lint, tests, then an offline end-to-end run
# (sample loaded into a scratch database, dbt build, publication).
# Started on demand from the Actions tab; locally, run `python run.py check`.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: fdic
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: fdic_dwh
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U fdic -d fdic_dwh"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5435"
      POSTGRES_DB: fdic_dwh
      POSTGRES_USER: fdic
      POSTGRES_PASSWORD: ci_only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python run.py check
